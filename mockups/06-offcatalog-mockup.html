<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="codeyam-viewport" content="mobile">
<title>Rings of walking time</title>
<style>
  :root {
    --bg: #ffffff;
    --glow: rgba(255, 203, 5, 0.32);
    --glow-2: rgba(255, 203, 5, 0);
    --ink: #00274c;
    --ink-soft: #4a6382;
    --ink-faint: #8fa1b8;
    --ring: rgba(0, 39, 76, 0.16);
    --ring-strong: rgba(0, 39, 76, 0.38);
    --surface: #f3f6fa;
    --line: #e1e7ef;
    --maize: #ffcb05;
    --you: #00274c;
    --open: #16894c;
    --few: #db6510;
    --full: #cc2e29;
    --dot-ring: #ffffff;
    --on-ink: #ffffff;
    --font-display: "Futura", "Century Gothic", "Avenir Next", "Avenir", "Trebuchet MS", sans-serif;
    --font: "Avenir Next", "Avenir", "Segoe UI", system-ui, sans-serif;
    --r-pill: 999px;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #061322;
    --glow: rgba(255, 203, 5, 0.16);
    --glow-2: rgba(255, 203, 5, 0);
    --ink: #eef3f9;
    --ink-soft: #a9bad0;
    --ink-faint: #6c819c;
    --ring: rgba(200, 220, 245, 0.14);
    --ring-strong: rgba(200, 220, 245, 0.34);
    --surface: #0e1f34;
    --line: #1d3250;
    --you: #ffcb05;
    --open: #3ccf80;
    --few: #ff9a45;
    --full: #ff5e56;
    --dot-ring: #061322;
    --on-ink: #061322;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; min-height: 844px; position: relative; overflow: hidden;
    background: radial-gradient(circle at 50% 360px, var(--glow) 0, var(--glow-2) 220px), var(--bg);
  }
  button, a { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-decoration: none; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .top { padding: 54px 16px 0; display: flex; justify-content: space-between; align-items: center; }
  .word { font-family: var(--font-display); font-weight: 700; font-size: 17px; letter-spacing: 0.01em; }
  .me { width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: var(--on-ink); font-size: 12px; font-weight: 700; display: grid; place-items: center; }

  h1 { margin: 22px 16px 0; text-align: center; font-family: var(--font-display); font-weight: 500; font-size: 30px; line-height: 1.12; letter-spacing: -0.01em; text-wrap: balance; }
  .lede { margin: 6px 16px 0; text-align: center; font-size: 14px; color: var(--ink-soft); }

  .rings { display: block; margin: 4px auto 0; width: 358px; height: 372px; }

  .walk { margin: 0 auto; display: flex; width: max-content; padding: 4px; border-radius: var(--r-pill); background: var(--surface); border: 1px solid var(--line); }
  .walk button { height: 34px; padding: 0 16px; border-radius: var(--r-pill); font-size: 14px; font-weight: 600; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .walk button.on { background: var(--ink); color: var(--on-ink); }

  .closing { margin: 14px 16px 0; text-align: center; font-size: 13px; color: var(--ink-soft); }
  .closing b { color: var(--few); font-weight: 600; }

  .nav { position: absolute; left: 0; right: 0; bottom: 0; height: 82px; background: var(--bg); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding: 10px 8px calc(22px + env(safe-area-inset-bottom)); }
  .nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--ink-faint); font-weight: 500; }
  .nav button.on { color: var(--ink); font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <header class="top">
    <div class="word">Stacks</div>
    <button class="me" aria-label="Signed in as Maya Okafor">MO</button>
  </header>

  <h1>What’s open near Angell Hall</h1>
  <p class="lede">Three spots have desks within a 6 minute walk.</p>

  <svg class="rings" viewBox="0 0 358 372" width="358" height="372" role="img" aria-label="Study spots placed by walking time and direction from you. Green has room, orange is nearly full, red is full.">
    <!-- rings: 3, 6 and 10 minutes -->
    <g fill="none">
      <circle cx="179" cy="196" r="45" stroke="var(--ring)" stroke-width="1"/>
      <circle cx="179" cy="196" r="90" stroke="var(--ring-strong)" stroke-width="1.5"/>
      <circle cx="179" cy="196" r="150" stroke="var(--ring)" stroke-width="1" stroke-dasharray="3 5"/>
    </g>
    <g font-family="Avenir Next, Avenir, Segoe UI, system-ui, sans-serif" font-size="10" font-weight="600" fill="var(--ink-faint)" text-anchor="middle">
      <text x="145" y="234">3 min</text>
      <text x="113" y="268">6 min</text>
      <text x="72" y="310">10 min</text>
      <text x="179" y="40" font-size="9">N</text>
    </g>

    <!-- spots, sized by total seats -->
    <g stroke="var(--dot-ring)" stroke-width="2">
      <circle cx="172" cy="176" r="9" fill="var(--full)"/>
      <circle cx="181" cy="241" r="12" fill="var(--open)"/>
      <circle cx="209" cy="144" r="21" fill="var(--open)"/>
      <circle cx="244" cy="159" r="13" fill="var(--few)"/>
      <circle cx="186" cy="121" r="9" fill="var(--few)"/>
      <circle cx="89" cy="204" r="15" fill="var(--open)"/>
      <circle cx="246" cy="276" r="14" fill="var(--full)"/>
      <circle cx="285" cy="70" r="13" fill="var(--open)"/>
    </g>
    <!-- you -->
    <circle cx="179" cy="196" r="13" fill="var(--maize)" opacity="0.45"/>
    <circle cx="179" cy="196" r="6" fill="var(--you)" stroke="var(--dot-ring)" stroke-width="2"/>

    <g font-family="Avenir Next, Avenir, Segoe UI, system-ui, sans-serif" font-size="11" fill="var(--ink)">
      <text x="160" y="172" text-anchor="end" font-weight="600">Fishbowl<tspan x="160" dy="13" fill="var(--full)">Full</tspan></text>
      <text x="198" y="245" font-weight="600">Law Reading Room<tspan x="198" dy="13" fill="var(--few)">22, closes 4:00</tspan></text>
      <text x="235" y="126" font-weight="700">Hatcher<tspan x="235" dy="13" fill="var(--open)" font-weight="600">128 desks</tspan></text>
      <text x="262" y="164" font-weight="600">Shapiro<tspan x="262" dy="13" fill="var(--few)">14</tspan></text>
      <text x="172" y="106" text-anchor="end" font-weight="600">League<tspan x="172" dy="13" fill="var(--few)">9</tspan></text>
      <text x="89" y="234" text-anchor="middle" font-weight="600">Union<tspan x="89" dy="13" fill="var(--open)">61</tspan></text>
      <text x="266" y="280" font-weight="600">Ross<tspan x="266" dy="13" fill="var(--full)">Full</tspan></text>
      <text x="285" y="99" text-anchor="middle" font-weight="600">Taubman<tspan x="285" dy="13" fill="var(--open)">88</tspan></text>
    </g>
  </svg>

  <div class="walk" role="tablist" aria-label="How far will you walk">
    <button role="tab" aria-selected="false">3 min</button>
    <button class="on" role="tab" aria-selected="true">6 min</button>
    <button role="tab" aria-selected="false">10 min</button>
  </div>
  <p class="closing" role="status"><b>Law Reading Room closes at 4:00&nbsp;PM.</b> Hatcher is open until 11.</p>

  <nav class="nav" aria-label="Main">
    <button class="on" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/></svg>Nearby</button>
    <button><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z"/><path d="M9 4v13.5M15 6.5V20"/></svg>Map</button>
    <button><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>Saved</button>
    <button><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Preferences</button>
  </nav>
</body>
</html>
