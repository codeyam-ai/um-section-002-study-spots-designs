<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="codeyam-viewport" content="mobile">
<title>Campus at night, glowing heat</title>
<style>
  :root {
    --night: #07111f;
    --ground: #0b1828;
    --street: #12233a;
    --diag: #0f2130;
    --roof: #22395a;
    --wall: #142841;
    --roof-hot: #2b4a72;
    --text: #eef2f8;
    --text-soft: #9fb0c6;
    --text-faint: #62748c;
    --glass: rgba(14, 28, 46, 0.78);
    --glass-line: rgba(160, 185, 215, 0.16);
    --card: #101f33;
    --card-2: #0d1a2b;
    --card-line: #1f3350;
    --maize: #ffcb05;
    --maize-ink: #07111f;
    --open: #38d07e;
    --few: #ff9b45;
    --full: #ff5a52;

    --radius-card: 22px;
    --radius-pill: 999px;
    --font: "Avenir Next", "Avenir", "Segoe UI", system-ui, -apple-system, sans-serif;
    color-scheme: dark;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--night); }
  body { font-family: var(--font); color: var(--text); -webkit-font-smoothing: antialiased; min-height: 844px; position: relative; overflow: hidden; }
  button, a { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-decoration: none; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--maize); outline-offset: 2px; }

  .map { position: absolute; inset: 0 0 auto 0; height: 560px; }
  .map svg { display: block; width: 390px; height: 560px; }
  .map::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(to bottom, rgba(7,17,31,0), var(--night)); pointer-events: none; }

  .tag { position: absolute; transform: translate(-50%, -100%); display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 9px; border-radius: var(--radius-pill); background: var(--glass); border: 1px solid var(--glass-line); font-size: 12px; font-weight: 600; white-space: nowrap; backdrop-filter: blur(6px); }
  .tag b { font-variant-numeric: tabular-nums; font-weight: 700; }
  .tag.o b { color: var(--open); } .tag.f b { color: var(--few); } .tag.x b { color: var(--full); }
  .tag.sel { background: var(--maize); color: var(--maize-ink); border-color: var(--maize); }
  .tag.sel b { color: var(--maize-ink); }

  .top { position: absolute; top: 54px; left: 16px; right: 16px; display: flex; gap: 10px; align-items: center; }
  .search { flex: 1; height: 44px; border-radius: var(--radius-pill); background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(10px); display: flex; align-items: center; gap: 10px; padding: 0 16px; color: var(--text-soft); font-size: 15px; }
  .me { width: 44px; height: 44px; border-radius: 50%; background: var(--glass); border: 1px solid var(--glass-line); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
  .need { position: absolute; top: 108px; left: 16px; display: inline-flex; padding: 3px; border-radius: var(--radius-pill); background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(10px); }
  .need button { height: 30px; padding: 0 14px; border-radius: var(--radius-pill); font-size: 13px; font-weight: 600; color: var(--text-soft); }
  .need button.on { background: var(--text); color: var(--night); }

  .deck { position: absolute; left: 16px; right: 16px; top: 486px; }
  .ghost { position: absolute; left: 0; right: 0; height: 60px; border-radius: var(--radius-card); background: var(--card-2); border: 1px solid var(--card-line); display: flex; align-items: flex-start; justify-content: space-between; padding: 10px 18px; font-size: 12px; color: var(--text-faint); }
  .ghost.g1 { top: 0; left: 24px; right: 24px; }
  .ghost.g2 { top: 12px; left: 12px; right: 12px; background: #0f1d30; color: var(--text-soft); }
  .front { position: relative; top: 26px; border-radius: var(--radius-card); background: var(--card); border: 1px solid var(--card-line); padding: 18px 18px 16px; box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.45); }
  .front .row1 { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .front h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; text-wrap: balance; }
  .front .sub { margin-top: 3px; font-size: 13px; color: var(--text-soft); }
  .save { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--card-line); display: grid; place-items: center; color: var(--maize); flex: none; }
  .counts { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  .counts div { font-size: 12px; color: var(--text-soft); }
  .counts b { display: block; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1.1; }
  .counts b.o { color: var(--open); }
  .cta { margin-top: 16px; display: flex; gap: 10px; }
  .cta a { flex: 1; height: 44px; border-radius: var(--radius-pill); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; }
  .cta .p { background: var(--maize); color: var(--maize-ink); }
  .cta .s { border: 1px solid var(--card-line); color: var(--text); }

  .nav { position: absolute; left: 0; right: 0; bottom: 0; height: 82px; background: var(--night); border-top: 1px solid var(--card-line); display: grid; grid-template-columns: repeat(4, 1fr); padding: 10px 8px calc(22px + env(safe-area-inset-bottom)); }
  .nav button { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--text-faint); }
  .nav button.on { color: var(--maize); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <div class="map" aria-label="Campus heat map at night">
    <svg viewBox="0 0 390 560" width="390" height="560" role="img" aria-label="Tilted view of Central Campus, buildings glowing green when open and red when full">
      <defs>
        <radialGradient id="hOpen"><stop offset="0" stop-color="var(--open)" stop-opacity="0.55"/><stop offset="1" stop-color="var(--open)" stop-opacity="0"/></radialGradient>
        <radialGradient id="hFew"><stop offset="0" stop-color="var(--few)" stop-opacity="0.5"/><stop offset="1" stop-color="var(--few)" stop-opacity="0"/></radialGradient>
        <radialGradient id="hFull"><stop offset="0" stop-color="var(--full)" stop-opacity="0.55"/><stop offset="1" stop-color="var(--full)" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="390" height="560" fill="var(--night)"/>
      <!-- ground plane -->
      <g transform="matrix(0.736 0.425 -0.736 0.425 195 150)">
        <rect x="-20" y="-20" width="340" height="340" fill="var(--ground)"/>
        <rect x="-20" y="34" width="340" height="7" fill="var(--street)"/>
        <rect x="-20" y="180" width="340" height="7" fill="var(--street)"/>
        <rect x="48" y="-20" width="7" height="340" fill="var(--street)"/>
        <rect x="238" y="-20" width="7" height="340" fill="var(--street)"/>
        <rect x="92" y="81" width="136" height="86" fill="var(--diag)"/>
        <path d="M92 81 L228 167 M228 81 L92 167" stroke="var(--street)" stroke-width="3"/>
        <!-- heat -->
        <circle cx="141" cy="60" r="62" fill="url(#hOpen)"/>
        <circle cx="194" cy="58" r="38" fill="url(#hFew)"/>
        <circle cx="73" cy="96" r="44" fill="url(#hFull)"/>
        <circle cx="25" cy="160" r="44" fill="url(#hOpen)"/>
        <circle cx="89" cy="211" r="40" fill="url(#hOpen)"/>
        <circle cx="200" cy="216" r="50" fill="url(#hFull)"/>
        <circle cx="101" cy="18" r="28" fill="url(#hFew)"/>
        <circle cx="271" cy="17" r="46" fill="url(#hOpen)"/>
        <!-- you, with a route to Hatcher -->
        <path d="M87 153 L110 120 L141 72" stroke="var(--maize)" stroke-width="2.5" stroke-dasharray="4 4" fill="none"/>
        <circle cx="87" cy="153" r="9" fill="var(--maize)" opacity="0.25"/>
        <circle cx="87" cy="153" r="4.5" fill="var(--maize)"/>
      </g>
      <!-- extruded buildings: wall layers then roof -->
      <g fill="var(--wall)">
        <g transform="translate(0 -2)"><g transform="matrix(0.736 0.425 -0.736 0.425 195 150)"><rect x="82" y="7" width="39" height="22"/><rect x="250" y="5" width="42" height="24"/><rect x="111" y="47" width="60" height="25"/><rect x="176" y="44" width="37" height="30"/><rect x="62" y="49" width="22" height="94"/><rect x="7" y="143" width="37" height="34"/><rect x="62" y="193" width="55" height="37"/><rect x="168" y="195" width="64" height="42"/></g></g>
        <g transform="translate(0 -5)"><g transform="matrix(0.736 0.425 -0.736 0.425 195 150)"><rect x="82" y="7" width="39" height="22"/><rect x="250" y="5" width="42" height="24"/><rect x="111" y="47" width="60" height="25"/><rect x="176" y="44" width="37" height="30"/><rect x="62" y="49" width="22" height="94"/><rect x="7" y="143" width="37" height="34"/><rect x="62" y="193" width="55" height="37"/><rect x="168" y="195" width="64" height="42"/></g></g>
        <g transform="translate(0 -8)"><g transform="matrix(0.736 0.425 -0.736 0.425 195 150)"><rect x="82" y="7" width="39" height="22"/><rect x="250" y="5" width="42" height="24"/><rect x="111" y="47" width="60" height="25"/><rect x="176" y="44" width="37" height="30"/><rect x="62" y="49" width="22" height="94"/><rect x="7" y="143" width="37" height="34"/><rect x="62" y="193" width="55" height="37"/><rect x="168" y="195" width="64" height="42"/></g></g>
        <g transform="translate(0 -11)"><g transform="matrix(0.736 0.425 -0.736 0.425 195 150)"><rect x="111" y="47" width="60" height="25"/><rect x="176" y="44" width="37" height="30"/><rect x="168" y="195" width="64" height="42"/><rect x="250" y="5" width="42" height="24"/></g></g>
        <g transform="translate(0 -14)"><g transform="matrix(0.736 0.425 -0.736 0.425 195 150)"><rect x="111" y="47" width="60" height="25"/><rect x="176" y="44" width="37" height="30"/></g></g>
      </g>
      <g fill="var(--roof)">
        <g transform="translate(0 -10)"><g transform="matrix(0.736 0.425 -0.736 0.425 195 150)"><rect x="82" y="7" width="39" height="22"/><rect x="62" y="49" width="22" height="94"/><rect x="7" y="143" width="37" height="34"/><rect x="62" y="193" width="55" height="37"/></g></g>
        <g transform="translate(0 -13)"><g transform="matrix(0.736 0.425 -0.736 0.425 195 150)"><rect x="168" y="195" width="64" height="42"/><rect x="250" y="5" width="42" height="24"/></g></g>
        <g transform="translate(0 -16)"><g transform="matrix(0.736 0.425 -0.736 0.425 195 150)"><rect x="176" y="44" width="37" height="30"/></g></g>
      </g>
      <g transform="translate(0 -16)"><g transform="matrix(0.736 0.425 -0.736 0.425 195 150)"><rect x="111" y="47" width="60" height="25" fill="var(--roof-hot)" stroke="var(--maize)" stroke-width="1.5"/></g></g>
    </svg>
    <span class="tag sel" style="left:255px; top:200px;">Hatcher <b>128</b></span>
    <span class="tag f" style="left:318px; top:226px;">Shapiro <b>14</b></span>
    <span class="tag f" style="left:256px; top:166px;">League <b>9</b></span>
    <span class="tag x" style="left:150px; top:205px;">Fishbowl <b>Full</b></span>
    <span class="tag o" style="left:82px; top:214px;">Union <b>61</b></span>
    <span class="tag o" style="left:84px; top:258px;">Law <b>22</b></span>
    <span class="tag x" style="left:183px; top:310px;">Ross <b>Full</b></span>
  </div>

  <header class="top">
    <div class="search" role="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Where to study?
    </div>
    <button class="me" aria-label="Signed in as Maya Okafor">MO</button>
  </header>
  <div class="need" role="tablist" aria-label="Studying">
    <button class="on" role="tab" aria-selected="true">Solo, desk</button>
    <button role="tab" aria-selected="false">Group, table</button>
  </div>

  <section class="deck" aria-label="Selected study spot">
    <div class="ghost g1" aria-hidden="true"><span>Law Reading Room</span><span>22</span></div>
    <div class="ghost g2" aria-hidden="true"><span>Michigan Union</span><span>61 seats</span></div>
    <article class="front">
      <div class="row1">
        <div>
          <h1>Hatcher Graduate Library</h1>
          <p class="sub">4 min walk from Angell Hall. Open until 11&nbsp;PM.</p>
        </div>
        <button class="save" aria-label="Save Hatcher to favorites">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>
        </button>
      </div>
      <div class="counts">
        <div><b class="o">128</b>desks open</div>
        <div><b>6</b>group tables</div>
        <div><b>41</b>by outlets</div>
      </div>
      <div class="cta">
        <a class="p" href="#">Walk there</a>
        <a class="s" href="#">See floors</a>
      </div>
    </article>
  </section>

  <nav class="nav" aria-label="Main">
    <button class="on" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5 9 4l6 2.5L21 4v13.5L15 20l-6-2.5L3 20z"/><path d="M9 4v13.5M15 6.5V20"/></svg>Map</button>
    <button><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>List</button>
    <button><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>Saved</button>
    <button><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Preferences</button>
  </nav>
</body>
</html>
